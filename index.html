<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>コンサート入場受付 QRスキャナー</title>
<style>
*{box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;max-width:640px;margin:0 auto;padding:18px;background:#f4f4f4;color:#222}
.card{background:white;border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 3px 16px #0001}
h1{font-size:1.35rem;margin:0 0 8px}p{line-height:1.55}
video{display:block;width:100%;background:#111;border-radius:12px;min-height:220px;object-fit:cover}
button{width:100%;padding:16px;border:0;border-radius:12px;font-size:1.05rem;font-weight:700;margin-top:10px;background:#222;color:white}
button.secondary{background:#e5e5e5;color:#222}
#status{white-space:pre-wrap;line-height:1.6;margin-top:12px}
input{width:100%;font-size:1.1rem;padding:13px;border:1px solid #aaa;border-radius:10px;margin-top:8px}
.small{font-size:.9rem;color:#555}
.result{padding:14px;border-radius:10px;background:#eee;margin-top:12px;white-space:pre-wrap;overflow-wrap:anywhere}
.result.ok{background:#e5f5e8}.result.error{background:#fff0f0}
</style>
</head>
<body>
<div class="card">
<h1>春野祐一郎ヴァイオリンリサイタル</h1><p>QRチケット 入場受付</p>
<video id="video" playsinline muted></video>
<button id="start" type="button">カメラを起動</button>
<button id="stop" type="button" class="secondary">カメラを停止</button>
<div id="status">カメラを起動してチケットのQRコードを映してください。</div>
<div id="result" class="result" hidden></div>
</div>
<div class="card">
<h2>受付番号を手入力</h2>
<form id="manualForm"><input id="manual" autocomplete="off" placeholder="受付番号を入力"><button type="submit">入場確認</button></form>
<p class="small">QRが読み取れない場合は、チケット記載の受付番号を入力してください。</p>
</div>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script>
'use strict';
const GAS_URL="https://script.google.com/macros/s/AKfycbyAv9bzjHhYkjnwt4mviq9G5Jqo4G1Oa7yt6bIHuge9uEE2tH8W2HX1Dlql4M6WcWE/exec";
const video=document.getElementById('video'),statusBox=document.getElementById('status'),resultBox=document.getElementById('result');
let stream=null,scanTimer=null,busy=false,requestTimer=null,requestScript=null;
function setStatus(s){statusBox.textContent=s}
function stopCamera(){if(scanTimer){clearInterval(scanTimer);scanTimer=null}if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}video.srcObject=null}
async function startCamera(){
 stopCamera();busy=false;
 if(!navigator.mediaDevices?.getUserMedia){setStatus('このブラウザではカメラを利用できません。Safariで受付ページを直接開いてください。');return}
 try{
  stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});
  video.srcObject=stream;await video.play();setStatus('カメラ起動中です。QRコードを映してください。');
  const canvas=document.createElement('canvas'),ctx=canvas.getContext('2d',{willReadFrequently:true});
  scanTimer=setInterval(()=>{
   if(busy||video.readyState<2||!window.jsQR)return;
   canvas.width=video.videoWidth;canvas.height=video.videoHeight;if(!canvas.width||!canvas.height)return;
   ctx.drawImage(video,0,0,canvas.width,canvas.height);
   const frame=ctx.getImageData(0,0,canvas.width,canvas.height);
   const code=jsQR(frame.data,frame.width,frame.height,{inversionAttempts:'attemptBoth'});
   if(code?.data){busy=true;stopCamera();submitOrderId(code.data)}
  },250);
 }catch(e){setStatus('カメラを起動できませんでした。詳細: '+e.name+' / '+e.message)}
}
function clearPendingRequest(){
 if(requestTimer){clearTimeout(requestTimer);requestTimer=null}
 if(requestScript){requestScript.onerror=null;requestScript.remove();requestScript=null}
 try{delete window.concertCheckinCallback}catch(_){window.concertCheckinCallback=undefined}
}
function submitOrderId(raw){
 const id=String(raw||'').trim();
 if(!id){busy=false;setStatus('QRコードから受付番号を読み取れませんでした。');return}
 clearPendingRequest();busy=true;resultBox.hidden=true;resultBox.className='result';
 setStatus('受付番号を読み取りました：'+id+'\\n受付結果を確認しています…');
 window.concertCheckinCallback=function(r){
  if(requestTimer){clearTimeout(requestTimer);requestTimer=null}
  if(requestScript){requestScript.onerror=null;requestScript.remove();requestScript=null}
  resultBox.hidden=false;
  if(!r||typeof r!=='object'){resultBox.className='result error';resultBox.textContent='Apps Scriptから有効な応答を受け取れませんでした。';setStatus('応答内容を確認できませんでした。');busy=false;return}
  resultBox.className=r.ok?'result ok':'result error';
  const lines=[(r.ok?'✅ ':'⚠️ ')+(r.message||'受付結果を確認してください')];
  if(r.orderId)lines.push('受付番号：'+r.orderId);
  if(r.name)lines.push('氏名：'+r.name);
  if(r.quantity!==undefined)lines.push('枚数：'+r.quantity+'枚');
  if(r.paymentStatus)lines.push('支払状況：'+r.paymentStatus);
  if(r.entryStatus)lines.push('入場状況：'+r.entryStatus);
  resultBox.textContent=lines.join('\\n');setStatus('受付結果を受信しました。');busy=false;
  try{delete window.concertCheckinCallback}catch(_){}
 };
 const sep=GAS_URL.includes('?')?'&':'?';
 requestScript=document.createElement('script');
 requestScript.src=GAS_URL+sep+'action=checkin&orderId='+encodeURIComponent(id)+'&callback=concertCheckinCallback&_='+Date.now();
 requestScript.async=true;
 requestScript.onerror=()=>{
  if(requestTimer){clearTimeout(requestTimer);requestTimer=null}
  resultBox.hidden=false;resultBox.className='result error';
  resultBox.textContent='Apps Scriptへの通信に失敗しました。\\n受付番号・通信環境・デプロイ設定を確認してください。';
  setStatus('Apps Scriptから応答を受け取れませんでした。');clearPendingRequest();busy=false;
 };
 requestTimer=setTimeout(()=>{
  resultBox.hidden=false;resultBox.className='result error';
  resultBox.textContent='Apps Scriptから15秒以内に応答がありませんでした。もう一度お試しください。';
  setStatus('応答待ちがタイムアウトしました。');clearPendingRequest();busy=false;
 },15000);
 document.body.appendChild(requestScript);
}
document.getElementById('start').addEventListener('click',startCamera);
document.getElementById('stop').addEventListener('click',()=>{stopCamera();setStatus('カメラを停止しました。')});
document.getElementById('manualForm').addEventListener('submit',e=>{
 e.preventDefault();const v=document.getElementById('manual').value.trim();
 if(!v){setStatus('受付番号を入力してください。');return}
 if(busy)return;submitOrderId(v);
});
</script>
</body>
</html>
